id: advertising_print
title: Рекламное производство и полиграфия
group: Продажи под заказ, B2B
status: full
markers: [полиграф, типографи, печат, вывеск, наружн реклам, световы короб, объёмн букв, объемн букв, баннер, широкоформатн, визитк, листовк, буклет, сувенирн, мерч, брендировани, оклейк, стенд]

sales_model:
  clients: B2B (магазины, рестораны, агентства, компании под мероприятия) и немного частников
  deal_type: под заказ, много мелких срочных заказов
  cycle: 1 день – 3 недели
  avg_check: 5 тыс. – 1 млн ₽
  repeat: высоко — агентства и сети заказывают постоянно

lead_sources: [сайт и карты, рекламные агентства, сарафан, Авито, повторные клиенты, холодные звонки новым заведениям]

funnel:
  - новая заявка
  - уточнение ТЗ — размеры, тираж, материалы, макет
  - расчёт стоимости
  - согласование макета
  - счёт и предоплата
  - в производстве
  - монтаж или выдача
  - окончательный расчёт

sales_roles: [менеджер по работе с клиентами, дизайнер, технолог или печатник, монтажник]
documents: [расчёт, макет на согласование, счёт, договор (для крупных), акт, УПД, согласование вывески с администрацией]
terms: [макет, тираж, ТЗ, препресс, цветопроба, ламинация, монтаж, согласование вывески]

sales_pains:
  - много мелких срочных заказов, менеджер тонет в переписке
  - расчёт каждого заказа вручную, у разных менеджеров разные цены
  - согласование макета тянется неделями, правки в разных чатах
  - постоянные клиенты-агентства без отдельных условий и без контроля объёма
  - нет напоминаний клиентам о повторной печати (визитки, меню, листовки кончаются)
  - заказы «на завтра» ломают очередь производства, срочность не оплачивается

other_pains:
  - брак и перепечатка из-за ошибок в макете или ТЗ
  - монтаж вывесок без графика, выезды срываются

automation:
  - заявки из почты, мессенджеров и сайта в одну CRM
  - калькулятор стоимости по материалам и тиражу
  - согласование макета в карточке заказа с фиксацией версии и подтверждения клиента
  - наценка за срочность по правилам
  - напоминания о повторном заказе через типичный срок
  - условия и отчёт по объёму для агентств-партнёров

questions:
  q_sales_flow:
    - text: Как согласуете макет с клиентом — где хранятся правки и как фиксируется «утверждаю»?
      skip_if: [утвержд, согласован макет]
    - text: Кто считает стоимость заказа и одинаково ли считают разные менеджеры?
      skip_if: [калькулятор, прайс]
  q_lead_sources:
    - text: Есть рекламные агентства, которые заказывают у вас постоянно? На каких условиях работаете?
      skip_if: [агентств]
  q_after_sale:
    - text: Напоминаете клиентам, когда у них заканчиваются визитки, меню или листовки?
      skip_if: [напомина]
  q_losses:
    - text: Как часто бывает перепечатка из-за ошибок в макете? Кто платит?
      skip_if: [перепечат, брак]

avoid:
  - технические вопросы про печать (CMYK, линиатура), если клиент сам не начал

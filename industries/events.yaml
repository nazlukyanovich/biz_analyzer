id: events
title: Event, свадьбы, банкеты, праздники
group: Услуги для людей
status: short
markers: [event, ивент, свадьб, банкетн зал, праздник, корпоратив, тимбилдинг, ведущ, декор, фотограф, видеограф, кейтеринг, аренда зал, организаци мероприяти]

sales_model:
  clients: частники (свадьбы, праздники) и B2B (корпоративы, конференции)
  deal_type: проект под дату
  cycle: 2 недели – 1 год
  avg_check: 30 тыс. – 5 млн ₽
  repeat: у частников низко, у компаний высоко — ежегодные корпоративы

lead_sources: [Инстаграм, сарафан, свадебные площадки и агрегаторы, площадки-партнёры, коллеги по рынку]

funnel:
  - заявка
  - проверка даты
  - встреча или созвон
  - смета или КП
  - бронь даты и предоплата
  - подготовка
  - мероприятие
  - окончательный расчёт и отзыв

sales_pains:
  - даты и брони в голове или в бумажном календаре, накладки
  - смета собирается из подрядчиков вручную
  - корпоративным клиентам не напоминают о следующем годе
  - много заявок «узнать цену» без продолжения

questions:
  q_sales_flow:
    - text: Как проверяете свободную дату и как ставите бронь? Бывают накладки?
      skip_if: [календар, накладк]
  q_after_sale:
    - text: Напоминаете компаниям о себе перед следующим корпоративом или праздником?
      skip_if: [напомина]

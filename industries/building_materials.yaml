id: building_materials
title: Производство и продажа стройматериалов
group: Продажи под заказ, B2B
status: full
markers: [стройматериал, бетон, кирпич, газобетон, газоблок, пеноблок, тротуарн, брусчатк, пиломатериал, сэндвич, профнастил, металлочерепиц, утеплител, сухие смеси, сухих смес, щебен, щебн]

sales_model:
  clients: B2B (строительные компании, бригады, магазины) и частники-застройщики
  deal_type: с полки или под объём, с доставкой
  cycle: 1 день – 1 месяц
  avg_check: 20 тыс. – 3 млн ₽
  repeat: высоко — строители берут на каждый объект

lead_sources: [звонки и сайт, Авито, менеджеры по работе с застройщиками, строительные рынки и базы, сарафан, дилеры]

funnel:
  - новая заявка или звонок
  - подбор и расчёт объёма
  - счёт или КП
  - согласование цены и доставки
  - оплата или отсрочка
  - отгрузка и доставка
  - закрывающие документы
  - повторный заказ

sales_roles: [менеджер по продажам, менеджер по ключевым клиентам, логист или диспетчер, бухгалтер]
documents: [прайс, КП, счёт, договор поставки, ТТН, УПД, сертификаты]
terms: [объём, куб, поддон, отгрузка, самовывоз, отсрочка, дилер, прайс для опта]

sales_pains:
  - менеджеры только принимают входящие звонки, активных продаж нет
  - нет базы клиентов-строителей — кто, когда брал и когда снова будет нужно
  - цены для разных клиентов «в голове» у менеджера, скидки бессистемные
  - отсрочки и долги клиентов отслеживаются в Excel или не отслеживаются
  - доставку согласуют в мессенджере, клиенты постоянно звонят «где машина»
  - сезонный спад, а план продаж не ставится

other_pains:
  - остатки на складе неизвестны менеджеру в моменте
  - ручная выписка документов в 1С после каждой отгрузки

automation:
  - CRM с базой клиентов и историей заказов из 1С
  - напоминание менеджеру, когда клиенту пора делать повторный заказ
  - прайс-листы по типам клиентов, скидки по правилам
  - контроль дебиторки с напоминаниями
  - заявки на доставку в одной системе, клиенту — сообщение о машине
  - план продаж по менеджерам и отчёт по выполнению

questions:
  q_sales_flow:
    - text: Менеджеры сами звонят строителям и бригадам или только принимают входящие?
      skip_if: [холодн, сами звон, обзвон]
  q_after_sale:
    - text: Как вы понимаете, что постоянному клиенту пора снова заказывать? Кто ему напоминает?
      skip_if: [напомина]
  q_decisions:
    - text: Как устроены цены для разных клиентов — есть прайсы для опта и розницы или менеджер решает сам?
      skip_if: [прайс]
  q_metrics:
    - text: Как контролируете отсрочки и долги клиентов?
      skip_if: [дебитор, отсрочк]
  q_double_entry:
    - text: Видит ли менеджер остатки на складе, когда говорит с клиентом?
      skip_if: [остат]

avoid:
  - вопросы про «путь клиента в соцсетях» — строители покупают по телефону

id: cleaning
title: Клининг и обслуживание объектов
group: Услуги для бизнеса
status: short
markers: [клининг, уборк, химчистк, мытьё окон, мытье окон, дезинфекц, дезинсекц, обслуживани здан, обслуживани офис]

sales_model:
  clients: частники (разовые уборки) и B2B (офисы, ТЦ, производства)
  deal_type: разовая услуга или абонемент
  cycle: день – 1 месяц для B2B
  avg_check: 3 тыс. – 500 тыс. ₽ в месяц
  repeat: высоко на B2B-договорах

lead_sources: [сайт и контекст, агрегаторы, Авито, тендеры, холодные звонки офисам, сарафан]

funnel:
  - заявка
  - расчёт или выезд на осмотр
  - КП
  - договор
  - первая уборка
  - регулярное обслуживание
  - продление

sales_pains:
  - разовые клиенты не превращаются в регулярных
  - расчёт по площади и видам работ каждый раз вручную
  - B2B-клиенты уходят из-за качества, а жалобы не фиксируются
  - тендеры отслеживаются нерегулярно

questions:
  q_sales_flow:
    - text: Как считаете стоимость — по площади, по прайсу, с выездом на осмотр? Сколько это занимает?
      skip_if: [площад, прайс]
  q_after_sale:
    - text: Предлагаете разовым клиентам регулярную уборку? Сколько соглашаются?
      skip_if: [регулярн, абонемент]

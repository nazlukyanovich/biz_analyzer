id: fitness
title: Фитнес, спорт, студии
group: Услуги для людей
status: short
markers: [фитнес, тренажёрн, спортзал, спортивн клуб, йога, пилатес, кроссфит, единоборств, танц, бассейн, стретчинг, персональн тренир]

sales_model:
  clients: частники
  deal_type: абонементы и персональные тренировки
  cycle: день – 2 недели
  avg_check: 3–100 тыс. ₽
  repeat: решающее — продление абонементов

lead_sources: [соцсети и таргет, карты, сарафан, пробные занятия, акции]

funnel:
  - заявка
  - пробное занятие
  - покупка абонемента
  - посещения
  - окончание абонемента
  - продление или возврат «уснувших»

sales_pains:
  - после пробного занятия никто не перезванивает
  - не отслеживается, кто перестал ходить, пока не кончится абонемент
  - продления не предлагаются заранее
  - тренеры продают персональные тренировки «мимо кассы»

questions:
  q_sales_flow:
    - text: Сколько человек после пробного занятия покупают абонемент? Кто с ними связывается?
      skip_if: [пробн]
  q_after_sale:
    - text: Как замечаете, что клиент перестал ходить, и что делаете, когда абонемент заканчивается?
      skip_if: [продлен]

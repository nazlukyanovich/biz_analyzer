id: furniture
title: Мебель на заказ (кухни, шкафы, корпусная и офисная)
group: Продажи под заказ, B2B
status: full
markers: [мебел, кухн, шкаф, гардероб, корпусн, столешниц, фасад, лдсп, мдф]

sales_model:
  clients: в основном частники, плюс дизайнеры, застройщики и офисы
  deal_type: под заказ
  cycle: 1–6 недель от заявки до договора
  avg_check: 150 тыс. – 1,5 млн ₽
  repeat: низко у частников, высоко через дизайнеров и рекомендации

lead_sources: [Инстаграм и таргет, сайт, Авито, дизайнеры интерьеров, салон или шоурум, сарафан]

funnel:
  - новая заявка
  - консультация и примерный расчёт
  - выезд замерщика
  - дизайн-проект и точный расчёт
  - встреча или согласование проекта
  - договор и предоплата
  - в производстве
  - доставка и сборка
  - окончательный расчёт и отзыв

sales_roles: [менеджер или дизайнер-консультант, замерщик, дизайнер-проектировщик, собственник]
documents: [расчёт, 3D-проект или визуализация, договор, спецификация с фурнитурой, счёт, акт сборки]
terms: [замер, проект, визуализация, фасады, фурнитура, ЛДСП, МДФ, столешница, сборка]

sales_pains:
  - много заявок «просто посчитать», до замера доходит малая часть, и никто не считает конверсию
  - проект и расчёт делает один дизайнер, очередь на проекты, клиент уходит к конкурентам
  - клиент «думает» после проекта, никто не перезванивает
  - нет связи между менеджером и дизайнерами интерьеров, бонусы им считают вручную
  - сделки в мессенджерах менеджеров, при увольнении база уходит с ними
  - скидки дают «на глаз», маржа неизвестна до конца заказа

other_pains:
  - ошибки замера и проекта → переделки фасадов за свой счёт
  - сроки производства срываются, клиенты злятся
  - сборщики работают сдельно, качество сборки не контролируется

automation:
  - воронка от заявки до сборки в CRM, заявки из Инстаграма и сайта падают туда сами
  - запись на замер по графику замерщика
  - автонапоминание «клиент думает» через 3 дня с примерами работ
  - шаблон договора и спецификации из карточки сделки
  - учёт дизайнеров-партнёров и их бонусов
  - сообщения клиенту о статусе — в производстве, доставка, сборка

questions:
  q_sales_flow:
    - text: Сколько заявок из 10 доходят до замера, а сколько — до договора? Где чаще всего отваливаются?
      skip_if: ["%", процент, из 10, из десяти, конверси]
    - text: Кто делает проект и расчёт после замера и сколько клиент ждёт результат?
      skip_if: [дизайнер дела, проект дела]
  q_lead_sources:
    - text: Работаете с дизайнерами интерьеров? Как ведёте учёт, кого они привели, и как им платите?
      skip_if: [дизайнер]
  q_decisions:
    - text: Кто решает, какую скидку дать клиенту, и знаете ли вы маржу заказа до запуска в производство?
      skip_if: [марж]
  q_losses:
    - text: Бывают переделки после замера или сборки? Как часто и кто за них платит?
      skip_if: [передел]

avoid:
  - вопросы про «оптовые закупки» — частники покупают один раз

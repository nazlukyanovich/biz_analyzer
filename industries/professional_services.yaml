id: professional_services
title: Бухгалтерия, юристы, консалтинг
group: Услуги для бизнеса
status: short
markers: [бухгалт, юрист, юридическ, адвокат, консалтинг, аудит, налог, кадров учёт, кадровый учет, регистраци бизнес, банкротств]

sales_model:
  clients: B2B и частники
  deal_type: абонентское обслуживание или разовая услуга
  cycle: 1 день – 1 месяц
  avg_check: 10 тыс. – 500 тыс. ₽, абонемент — в месяц
  repeat: очень высоко на абонементе

lead_sources: [сарафан, сайт и контекст, карты, личный бренд, партнёры (банки, IT-интеграторы)]

funnel:
  - новая заявка
  - бесплатная консультация
  - КП или расчёт стоимости
  - договор
  - оплата
  - оказание услуги или абонемент
  - допродажа других услуг

sales_pains:
  - продают сами специалисты в перерывах между работой
  - бесплатные консультации отнимают время и не конвертируются в договоры
  - стоимость абонемента считается индивидуально и долго
  - клиентам не предлагают другие услуги компании

questions:
  q_sales_flow:
    - text: Даёте бесплатную консультацию? Сколько клиентов после неё заключают договор?
      skip_if: [консультаци]
  q_owner_role:
    - text: Кто продаёт — отдельный менеджер или сами специалисты в перерывах между работой?
      skip_if: [менеджер]
  q_after_sale:
    - text: Предлагаете действующим клиентам другие ваши услуги? Кто это делает?
      skip_if: [допрода, предлагаем]

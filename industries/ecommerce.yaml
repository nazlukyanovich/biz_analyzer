id: ecommerce
title: Интернет-магазин и маркетплейсы
group: Торговля
status: full
markers: [интернет-магазин, интернет магазин, маркетплейс, wildberries, вайлдберриз, вб, wb, ozon, озон, селлер, карточки товар, яндекс маркет, онлайн-магазин, продаём онлайн, продаем онлайн, dropshipping, дропшиппинг]

sales_model:
  clients: частники, иногда оптовики и компании
  deal_type: с полки, онлайн-оплата, наложенный платёж, предзаказ
  cycle: минуты – пара дней (дорогие товары — до 2 недель с консультацией)
  avg_check: 1–30 тыс. ₽, техника и мебель — до 300 тыс. ₽
  repeat: зависит от товара — ключевая метрика для роста

lead_sources: [маркетплейсы, таргет и контекст, SEO, блогеры и посевы, рассылки и Telegram-канал, соцсети, агрегаторы цен]

funnel:
  - заявка, корзина или вопрос в чате
  - консультация (для сложных товаров)
  - подтверждение заказа
  - оплата
  - сборка и отправка
  - доставлено и выкуплено
  - отзыв
  - повторная покупка

sales_roles: [менеджер по заказам или оператор, менеджер маркетплейсов, контент-менеджер, кладовщик, маркетолог]
documents: [оферта, счёт и чек, накладная службы доставки, возвратная накладная, договор с маркетплейсом]
terms: [корзина, выкуп, невыкуп, возврат, карточка товара, СПП, остатки, FBO и FBS, конверсия сайта, ДРР]

sales_pains:
  - заказы с сайта, маркетплейсов и соцсетей в разных кабинетах, сводят вручную
  - брошенные корзины и неподтверждённые заказы никто не дожимает
  - вопросы в директ, мессенджеры и чат на сайте висят без ответа часами
  - процент невыкупа наложенного платежа высокий и не анализируется
  - нет базы покупателей для повторных продаж и рассылок, на маркетплейсе клиент «чужой»
  - непонятно, какой канал рекламы реально окупается, ДРР не считают
  - отзывы и вопросы на маркетплейсах обрабатываются нерегулярно, рейтинг падает
  - консультации по сложным товарам — без скриптов, каждый менеджер продаёт по-своему

other_pains:
  - остатки на складе и на маркетплейсах расходятся, отмены из-за отсутствия товара
  - упаковка и отправка — вручную, ошибки в заказах
  - возвраты без учёта причин

automation:
  - все заказы и обращения (сайт, маркетплейсы, соцсети, чат) в одной CRM
  - автосообщение и звонок по брошенной корзине и неподтверждённому заказу
  - подтверждение заказа ботом, а не звонком оператора
  - синхронизация остатков между складом, сайтом и маркетплейсами
  - сегменты покупателей и автоматические рассылки — повторная покупка, акции, день рождения
  - сквозная аналитика — ДРР и окупаемость по каналам
  - шаблоны ответов на отзывы и вопросы маркетплейсов

questions:
  q_lead_sources:
    - text: Какая доля продаж идёт с маркетплейсов, а какая — с вашего сайта и соцсетей?
      skip_if: ["%", процент, доля]
  q_communication:
    - text: Сколько времени покупатель ждёт ответа в чате или директе? Кто отвечает вечером и в выходные?
      skip_if: [минут, круглосуточн, бот]
  q_sales_flow:
    - text: Есть заказы, которые надо подтверждать звонком или сообщением? Сколько из них отваливается?
      skip_if: [подтвержд]
    - text: Что происходит с брошенными корзинами — напоминаете о них?
      skip_if: [брошен, корзин]
    - text: Какой у вас процент невыкупа или возвратов? Понимаете, из-за чего?
      skip_if: [невыкуп, выкуп]
  q_double_entry:
    - text: Остатки на складе и на маркетплейсах обновляются сами или вручную? Бывают отмены из-за того, что товара нет?
      skip_if: [синхрониз, автоматически обновл]
  q_after_sale:
    - text: Собираете базу покупателей? Делаете им рассылки или предложения на повторную покупку?
      skip_if: [рассылк, база покупател]
    - text: Кто отвечает на отзывы и вопросы на маркетплейсах и как быстро?
      skip_if: [отзыв]
  q_metrics:
    - text: Знаете, сколько стоит привлечь одного покупателя из каждого канала и сколько он приносит за год?
      skip_if: [стоимость привлечен, cac, ltv, дрр]

avoid:
  - узкие вопросы про алгоритмы маркетплейсов — нас интересуют продажи и процессы

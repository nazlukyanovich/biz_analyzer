id: beauty
title: Салоны красоты, барбершопы, косметология
group: Услуги для людей
status: full
markers: [салон красот, барбершоп, барбер, парикмахер, стрижк, окрашивани, маникюр, педикюр, ногт, косметолог, косметологи, бров, ресниц, массаж, спа-салон, spa, визаж, эпиляц, депиляц, лазерн эпиляц, студи красот, nail, бьюти, beauty, тату, перманентн макияж]

sales_model:
  clients: частники
  deal_type: запись на услугу, абонементы и курсы процедур, продажа косметики, подарочные сертификаты
  cycle: минуты – день
  avg_check: 1–15 тыс. ₽, курс процедур у косметолога — до 100 тыс. ₽
  repeat: решающее — бизнес живёт на постоянных клиентах (стрижка раз в месяц, маникюр раз в 3 недели)

lead_sources: [Инстаграм и VK, Яндекс Карты и 2ГИС, агрегаторы записи, сарафан, мастера приводят своих клиентов, сертификаты в подарок, акции для новых клиентов]

funnel:
  - заявка, сообщение или онлайн-запись
  - подтверждение записи (напоминание накануне)
  - визит
  - оплата и продажа уходовой косметики
  - запись на следующий визит прямо на месте
  - отзыв
  - напоминание, когда пора снова
  - «потерянный» клиент — возврат

sales_roles: [администратор, мастера, косметолог, управляющий, собственник]
documents: [прайс, онлайн-запись, абонемент, подарочный сертификат, информированное согласие (косметология), договор с мастером]
terms: [запись, окна, загрузка мастеров, неявка, повторный визит, отток, средний чек, абонемент, сертификат, допродажа ухода]

sales_pains:
  - клиенты «принадлежат» мастерам и уходят вместе с ними
  - записи в директе, мессенджерах и по телефону, администратор не успевает отвечать
  - неявки и поздние отмены без подтверждения и напоминаний — окна сгорают
  - клиентов, которые давно не приходили, никто не возвращает
  - не записывают на следующий визит прямо на месте
  - не продаются абонементы, курсы процедур и уходовая косметика
  - загрузка мастеров неравномерная, пустые окна в будни не заполняются акциями
  - отзывы на картах не собираются

other_pains:
  - мастера работают «мимо кассы» с личными клиентами
  - зарплата мастеров считается вручную по процентам
  - расходники заканчиваются внезапно

automation:
  - онлайн-запись с видимостью окон мастеров, запись из Инстаграма и карт в одну систему
  - напоминание и подтверждение записи за сутки и за 2 часа — меньше неявок
  - запись на следующий визит при оплате
  - автонапоминание, когда пора снова (по типу услуги — 3–5 недель)
  - возврат «уснувших» — сообщение со спецпредложением через 60 дней без визита
  - продажа абонементов и сертификатов онлайн
  - просьба об отзыве после визита
  - клиентская база принадлежит салону, а не мастеру

questions:
  q_lead_sources:
    - text: Откуда приходят новые клиенты — Инстаграм, карты, агрегаторы, сарафан? Какой канал главный?
      skip_if: [главн]
  q_communication:
    - text: Как клиенты записываются — через онлайн-запись, в директ, по телефону? Сколько сообщений остаются без ответа в загруженные часы?
      skip_if: [онлайн-запис, yclients, dikidi]
  q_sales_flow:
    - text: Подтверждаете запись накануне? Сколько примерно неявок в неделю?
      skip_if: [неявк, подтвержд]
    - text: Предлагаете записаться на следующий визит прямо при оплате?
      skip_if: [следующ визит]
    - text: Продаёте уходовую косметику, абонементы или сертификаты? Кто это предлагает?
      skip_if: [абонемент, сертификат, косметик]
  q_sales_control:
    - text: Видите загрузку каждого мастера? Как заполняете пустые окна?
      skip_if: [загрузк]
  q_after_sale:
    - text: Что делаете, если постоянный клиент давно не приходил?
      skip_if: [возвраща, напомина]
    - text: Просите клиентов оставить отзыв на картах?
      skip_if: [отзыв]
  q_single_person:
    - text: Если мастер уходит — клиенты остаются у салона или уходят с ним?
      skip_if: [уходят с ним, остаются]

avoid:
  - вопросы про технику процедур — нас интересуют запись, возвраты клиентов и продажи

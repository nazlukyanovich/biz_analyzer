id: logistics
title: Логистика и грузоперевозки
group: Услуги для бизнеса
status: short
markers: [логистик, грузоперевоз, перевозк, экспедир, экспедиц, фуры, тягач, транспортн компан, таможен, сборн груз, доставк груз]

sales_model:
  clients: B2B
  deal_type: разовая перевозка или договор на регулярные
  cycle: часы – 2 недели
  avg_check: 10 тыс. – 1 млн ₽ за рейс
  repeat: высоко — грузовладельцы возят регулярно

lead_sources: [биржи грузов (ATI), сайт и контекст, холодные звонки, сарафан, тендеры]

funnel:
  - запрос ставки
  - расчёт ставки
  - согласование
  - договор-заявка
  - подбор машины
  - перевозка
  - закрывающие документы
  - оплата

sales_pains:
  - ставки считаются вручную, клиент получает ответ поздно
  - запросы с бирж и почты не учитываются, конверсия неизвестна
  - разовые клиенты не становятся постоянными, им не звонят
  - оплаты задерживаются, документы теряются

questions:
  q_sales_flow:
    - text: Как быстро вы называете клиенту ставку и сколько запросов превращаются в рейс?
      skip_if: [ставк]
  q_after_sale:
    - text: Что делаете с клиентами после первой перевозки, чтобы они возили с вами регулярно?
      skip_if: [постоянн, регулярн]
  q_metrics:
    - text: Как контролируете оплату рейсов и возврат оригиналов документов?
      skip_if: [оригинал, дебитор]

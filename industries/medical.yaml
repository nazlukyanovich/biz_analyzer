id: medical
title: Медицина, стоматология, ветеринария
group: Услуги для людей
status: short
markers: [клиник, медицин, медцентр, стоматолог, врач, пациент, лечени, ветеринар, ветклиник, диагностическ центр, узи, анализ крови]

sales_model:
  clients: частники, плюс корпоративные договоры и страховые
  deal_type: приём, план лечения, программы и абонементы
  cycle: день – несколько недель (план лечения)
  avg_check: 2 тыс. – 500 тыс. ₽ (имплантация)
  repeat: высоко — контрольные визиты, гигиена, семьи

lead_sources: [карты и отзывы, сайт и контекст, агрегаторы (ПроДокторов), сарафан, корпоративные клиенты]

funnel:
  - звонок или заявка
  - запись на консультацию
  - первичный приём
  - план лечения
  - согласие и предоплата
  - лечение
  - контрольный визит
  - повторный визит или гигиена

sales_pains:
  - пациенты получили план лечения и не вернулись — им не звонят
  - администраторы пропускают звонки в пиковые часы
  - запись не подтверждается, неявки
  - нет напоминаний о плановых визитах (гигиена, контроль)
  - врачи не объясняют стоимость, пациента «продают» администраторы

questions:
  q_sales_flow:
    - text: Сколько пациентов после консультации и плана лечения действительно начинают лечение? Кто с ними работает, если они «подумают»?
      skip_if: [план лечени]
  q_communication:
    - text: Сколько звонков пропускают администраторы в загруженные часы? Перезванивают ли на пропущенные?
      skip_if: [пропущен]
  q_after_sale:
    - text: Напоминаете пациентам о контрольных визитах и плановой гигиене?
      skip_if: [напомина]

id: infobusiness
title: Инфобизнес — эксперты, онлайн-курсы, наставничество, продюсирование
group: Инфобизнес
status: full
markers: [инфобизнес, инфопродукт, онлайн-курс, онлайн курс, наставничеств, менторств, коуч, марафон, интенсив, продюсер, продюсирован, эксперт, автоворонк, прогрев, геткурс, getcourse, вебинар, клуб по подписке, закрытый клуб, мастер-класс, гайд, трипвайр]

sales_model:
  clients: частники (B2C), иногда B2B — эксперты для других экспертов
  deal_type: курс, наставничество, клуб по подписке, консультация; продукты-лесенка от дешёвого к дорогому
  cycle: минуты (трипвайр) – 2–4 недели (запуск, наставничество)
  avg_check: 500 ₽ – 300 тыс. ₽, наставничество — до миллиона
  repeat: решающее — лесенка продуктов и допродажи выпускникам

lead_sources: [соцсети эксперта (Инстаграм, Telegram, YouTube, VK), таргет, посевы в Telegram-каналах, блогеры, вебинары и эфиры, лид-магниты и гайды, чат-боты, сарафан и отзывы]

funnel:
  - подписчик или регистрация (лид-магнит, вебинар)
  - прогрев (рассылка, эфиры, контент)
  - заявка или бронь места
  - созвон или переписка с менеджером (диагностика)
  - оплата или рассрочка
  - доступ к курсу, онбординг
  - обучение и сопровождение кураторами
  - результат и отзыв
  - допродажа следующего продукта

sales_roles: [эксперт (часто продаёт сам), продюсер, менеджеры по продажам или «отдел заботы», чат-менеджеры, таргетолог, кураторы, техспециалист (платформа, боты)]
documents: [оферта, договор, счёт и ссылка на оплату, рассрочка (банк или своя), акт для B2B, политика возвратов]
terms: [лид, лид-магнит, трипвайр, прогрев, запуск, воронка, автовебинар, диагностика, бронь, дожим, рассрочка, LTV, окупаемость рекламы, ROMI, кураторы, возвраты]

sales_pains:
  - заявок после эфира или вебинара много, менеджеры не успевают обработать всех в первые часы
  - заявки и переписки разбросаны по директу, Telegram, WhatsApp и платформе — кто кому писал, не видно
  - дожим идёт «по памяти», ушедших после созвона никто не возвращает
  - не считается окупаемость: сколько стоил лид, сколько оплат, какой ROMI у запуска
  - всё держится на эксперте — он продаёт на эфирах и созвонах, без него продаж нет
  - менеджеры работают по своим скриптам, качество созвонов никто не слушает
  - брошенные оплаты и неполные предоплаты не дожимаются
  - выпускникам не продают следующий продукт, база не прогревается между запусками
  - возвраты денег — без учёта причин

other_pains:
  - техническая каша — платформа, бот, таблица, платёжка не связаны, данные вручную
  - кураторы перегружены, ученики бросают курс, отсюда возвраты и мало отзывов
  - выгорание эксперта, всё завязано на одного человека

automation:
  - все заявки (лендинг, бот, директ, вебинар) в одну CRM с автораспределением на менеджеров
  - автозадача менеджеру перезвонить в первые 15 минут после заявки
  - сквозная аналитика — от источника и креатива до оплаты и ROMI запуска
  - автоматические касания — напоминания о вебинаре, дожим брошенной оплаты, цепочки после эфира
  - записи созвонов и чек-лист оценки менеджеров
  - сегментация базы по продуктам и этапам, автоматические предложения выпускникам
  - интеграция платформы (GetCourse и т.п.) и CRM, чтобы оплаты и доступы шли без ручного переноса

questions:
  q_lead_sources:
    - text: Откуда больше всего заявок — ваш блог, таргет, посевы, вебинары? Что из этого реально окупается?
      skip_if: [окупа, romi]
    - text: Есть лид-магниты, гайды или бот, через которые люди попадают в базу? Что с ними происходит дальше?
      skip_if: [лид-магнит, гайд]
  q_lead_volume:
    - text: Сколько заявок приходит за запуск или за месяц и сколько из них оплачивают?
      skip_if: ["%", процент, из 100, конверси]
  q_sales_flow:
    - text: Человек оставил заявку после эфира. Через сколько с ним связывается менеджер и что происходит дальше — созвон, переписка, ссылка на оплату?
      skip_if: [минут, созвон, диагностик]
    - text: Что делаете с теми, кто не оплатил после созвона или бросил оплату на середине?
      skip_if: [дожим, брошен]
    - text: Продаёте в рассрочку? Как контролируете, что люди платят вовремя?
      skip_if: [рассрочк]
  q_owner_role:
    - text: Продаёте сами на эфирах и созвонах или этим занимаются менеджеры? Что будет с продажами, если вы месяц не выходите в эфир?
      skip_if: [менеджеры продают]
  q_sales_control:
    - text: Слушаете созвоны менеджеров? Есть скрипт и понимание, кто из менеджеров продаёт лучше и почему?
      skip_if: [скрипт, прослуш]
  q_tools:
    - text: На какой платформе курсы и как она связана с CRM, ботом и платёжкой? Что переносится вручную?
      skip_if: [геткурс, getcourse, интеграци]
  q_metrics:
    - text: Считаете стоимость заявки, стоимость оплаты и окупаемость каждого запуска?
      skip_if: [romi, окупаемост, стоимость заявк]
  q_after_sale:
    - text: Что предлагаете выпускникам — следующий продукт, клуб, наставничество? Сколько из них покупают снова?
      skip_if: [следующ продукт, лесенк]
  q_losses:
    - text: Бывают возвраты денег? Сколько и почему просят вернуть?
      skip_if: [возврат]

avoid:
  - осуждающий тон про «инфоцыган» — клиент строит бизнес, говорим на его языке
  - вопросы про методику курса — нас интересуют продажи и процессы

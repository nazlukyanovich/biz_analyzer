id: travel
title: Туризм и турагентства
group: Услуги для людей
status: short
markers: [турагент, туроператор, туры, туров, путешестви, путёвк, экскурси, отел, гостиниц, хостел, глэмпинг, база отдыха, визы]

sales_model:
  clients: частники и корпоративные клиенты
  deal_type: подбор тура или бронь проживания
  cycle: день – 2 месяца
  avg_check: 30 тыс. – 1 млн ₽
  repeat: высоко — отпуск каждый год, если о себе напоминать

lead_sources: [соцсети, сайт и контекст, сарафан, офис, агрегаторы бронирования]

funnel:
  - заявка
  - уточнение пожеланий
  - подборка вариантов
  - выбор и бронь
  - оплата
  - документы и поездка
  - отзыв
  - следующий отпуск

sales_pains:
  - подборки делаются вручную, клиент ждёт и уходит к другим
  - клиент «подумает» и пропадает, перезвонов нет
  - не напоминают постоянным клиентам о следующем отпуске
  - заявки в личных мессенджерах менеджеров

questions:
  q_sales_flow:
    - text: Сколько времени уходит на подборку вариантов для клиента? Что делаете, если он пропал после подборки?
      skip_if: [подборк]
  q_after_sale:
    - text: Напоминаете клиентам о себе перед следующим сезоном отпусков?
      skip_if: [напомина]

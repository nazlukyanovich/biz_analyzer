id: education
title: Обучение и услуги для детей — курсы, школы, детские центры, кружки, лагеря
group: Услуги для людей
status: full
markers: [детск центр, детей, детям, дети, ребенк, ребёнк, кружк, секци, развивашк, развивающ занят, лагер, подготовк к школ, продленк, продлёнк, садик, частн сад, курсы, курс, школа, школ, учебн центр, обучени, тренинг, репетитор, преподава, ученик, студент, языков, английск, программировани для детей, робототехник, шахмат]

sales_model:
  clients: родители (решают и платят), взрослые ученики, иногда компании
  deal_type: абонемент, курс, учебный год, смена в лагере, пробное занятие
  cycle: день – 3 недели; пик продаж — август–сентябрь и январь
  avg_check: 3 тыс. – 50 тыс. ₽ в месяц, лагерь и учебный год — до 300 тыс. ₽
  repeat: решающее — продление абонементов, следующий уровень, братья и сёстры, лагерь летом

lead_sources: [таргет и соцсети, карты, сарафан и родительские чаты, пробные занятия и дни открытых дверей, школы и садики рядом, листовки, агрегаторы кружков]

funnel:
  - заявка (от родителя)
  - звонок и подбор группы или направления
  - запись на пробное занятие
  - пробное занятие (напоминание накануне)
  - обратная связь родителю после пробного
  - покупка абонемента или курса
  - занятия и посещаемость
  - продление абонемента
  - следующий уровень, лагерь, другое направление

sales_roles: [администратор, менеджер по продажам, педагоги и преподаватели, методист, руководитель центра]
documents: [договор с родителем, оферта, абонемент, расписание, согласие на обработку данных, справки для налогового вычета, медицинские справки для лагеря]
terms: [пробное занятие, абонемент, посещаемость, продление, отток, заполняемость групп, расписание, налоговый вычет, родительский чат]

sales_pains:
  - заявок в сезон много, администратор не успевает перезвонить всем в первые часы
  - после пробного занятия родителю не дают обратную связь и не дожимают
  - конверсия из пробного в абонемент не считается
  - не отслеживается, кто перестал ходить, пока не кончится абонемент — тихий отток
  - продления не предлагаются заранее, родители «забывают» оплатить
  - оплаты, долги и рассрочки ведутся в таблице, напоминания вручную
  - заполняемость групп неизвестна — одни группы переполнены, другие пустые
  - выпускникам и родителям не предлагают следующий курс, лагерь, второе направление

other_pains:
  - расписание и замены педагогов — в чате
  - родительские чаты превращаются в поток вопросов к администратору
  - уход педагога уводит учеников за собой

automation:
  - заявки с сайта, соцсетей и карт в одну CRM с задачей перезвонить в первый час
  - онлайн-запись на пробное и автоматическое напоминание родителю
  - задача педагогу дать обратную связь после пробного, сообщение родителю с предложением абонемента
  - учёт посещаемости и сигнал, если ребёнок пропустил 2 занятия подряд
  - автонапоминания о продлении и оплате, онлайн-оплата абонемента
  - отчёт по заполняемости групп и загрузке педагогов
  - предложения по лесенке — следующий уровень, лагерь, второе направление, скидка для брата или сестры

questions:
  q_lead_volume:
    - text: Сколько заявок приходит в сезон и успевает ли администратор перезвонить каждой в первый час?
      skip_if: [сразу перезван, в течение час]
  q_sales_flow:
    - text: Есть пробное занятие? Сколько семей после него покупают абонемент?
      skip_if: [из 10, из десяти, "%", процент]
    - text: Что происходит после пробного — педагог даёт родителю обратную связь? Кто предлагает абонемент?
      skip_if: [обратн связ]
    - text: Как родители платят — онлайн, на месте, по счёту? Как напоминаете о следующей оплате?
      skip_if: [онлайн-оплат, автоплат]
  q_sales_control:
    - text: Знаете, насколько заполнены группы и сколько свободных мест?
      skip_if: [заполняем]
  q_after_sale:
    - text: Как замечаете, что ребёнок стал пропускать или перестал ходить? Что делаете?
      skip_if: [посещаем, пропуск]
    - text: Предлагаете семьям продолжение — следующий уровень, лагерь, другое направление, скидку для брата или сестры?
      skip_if: [следующ уров, лагер]
  q_communication:
    - text: Есть родительские чаты? Кто в них отвечает и сколько времени это занимает?
      skip_if: [родительск чат]
  q_single_person:
    - text: Если педагог уходит — ученики остаются у вас или уходят вслед за ним?
      skip_if: [уходят за, остаются]

avoid:
  - вопросы про методику и программы обучения — нас интересуют продажи и удержание

id: windows_doors
title: Окна, двери, остекление, натяжные потолки
group: Продажи под заказ, B2B
status: full
markers: [окн, пластиков, пвх, остеклени, балкон, лоджи, двер, межкомнатн, натяжн, потолк, жалюз, рольстав, москитн]

sales_model:
  clients: частники, плюс застройщики и ремонтные бригады
  deal_type: под заказ с монтажом
  cycle: 1 день – 3 недели
  avg_check: 30–400 тыс. ₽
  repeat: низко, зато много рекомендаций соседям и знакомым

lead_sources: [контекстная реклама, сайт, Авито, листовки в новостройках, сарафан, ремонтные бригады, застройщики]

funnel:
  - новая заявка
  - звонок и примерная цена
  - запись на замер
  - замер и расчёт на месте
  - договор и предоплата (часто прямо на замере)
  - заказ на производстве или у поставщика
  - монтаж
  - окончательный расчёт и отзыв

sales_roles: [менеджер колл-центра, замерщик (часто он же продаёт), монтажник, собственник]
documents: [расчёт, договор, бланк замера, счёт, акт выполненных работ, гарантийный талон]
terms: [замер, профиль, стеклопакет, откосы, подоконник, монтаж, ПВХ-полотно, багет]

sales_pains:
  - продажа случается на замере, но никто не считает, сколько замеров закрывается в договор
  - замерщик продаёт по-своему, цены и скидки у каждого разные
  - заявки из рекламы обрабатываются медленно, клиент успевает вызвать конкурентов
  - отказавшимся после замера не перезванивают
  - стоимость заявки из рекламы неизвестна, деньги на рекламу тратятся вслепую
  - сезонность — летом очередь на замеры, зимой простой

other_pains:
  - ошибки замера → перезаказ изделия
  - график монтажников ведётся в тетради или чате
  - рекламации и гарантийные выезды не учитываются

automation:
  - заявки из рекламы и сайта сразу в CRM с задачей перезвонить за 5 минут
  - график замерщиков и монтажников в календаре CRM
  - единый калькулятор и прайс для всех замерщиков
  - автозвонок или сообщение отказникам через неделю
  - учёт рекламных каналов — сколько стоит заявка, замер и договор
  - просьба об отзыве и рекомендации после монтажа

questions:
  q_sales_flow:
    - text: Договор подписывают прямо на замере или позже? Сколько замеров из 10 заканчиваются договором?
      skip_if: [из 10, из десяти, "%", процент]
    - text: Как быстро вы перезваниваете на заявку из рекламы? Кто это делает?
      skip_if: [минут, сразу перезван]
  q_decisions:
    - text: Замерщик может сам дать скидку на месте? В каких пределах?
      skip_if: [скидк]
  q_metrics:
    - text: Знаете, сколько вам стоит одна заявка и один договор из каждого рекламного канала?
      skip_if: [стоимость заявк, цена заявк, цена лида]
  q_fulfillment_flow:
    - text: Как планируете замеры и монтажи — в календаре, в таблице или в чате?
      skip_if: [календар, график]

avoid:
  - сложные слова про «юнит-экономику» — лучше спрашивать «сколько стоит одна заявка»

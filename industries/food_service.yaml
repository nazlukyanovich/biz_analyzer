id: food_service
title: Кафе, рестораны, доставка еды
group: Общепит
status: short
markers: [кафе, ресторан, кофейн, пиццер, суши, роллы, столов, общепит, фастфуд, бургер, пекарн, кондитерск, доставк еды, шаурм, кальянн]

sales_model:
  clients: частники, плюс банкеты и корпоративные заказы
  deal_type: чек в зале, доставка, банкеты, кейтеринг
  cycle: минуты (банкеты — недели)
  avg_check: 500 ₽ – 5 тыс. ₽ на гостя, банкет — от 50 тыс. ₽
  repeat: решающее — постоянные гости и программа лояльности

lead_sources: [проходящий трафик, карты и отзывы, агрегаторы доставки, соцсети, сарафан]

funnel:
  - гость или заказ доставки
  - заказ
  - оплата
  - отзыв
  - повторный визит
  - банкет или корпоративный заказ — отдельная воронка (заявка → меню → предоплата → проведение)

sales_pains:
  - заявки на банкеты в директе и по телефону, без учёта и дожима
  - нет базы гостей, программа лояльности не работает
  - отзывы на картах никто не обрабатывает
  - доставка через агрегаторы съедает маржу, своих каналов заказа нет

questions:
  q_sales_flow:
    - text: Как принимаете заявки на банкеты и корпоративы? Кто считает меню и дожимает заказчика?
      skip_if: [банкет]
  q_after_sale:
    - text: Собираете контакты гостей? Есть программа лояльности, которая реально возвращает людей?
      skip_if: [лояльност, бонус]
  q_lead_sources:
    - text: Какая доля заказов доставки идёт через агрегаторы, а какая — через ваш сайт или телефон?
      skip_if: [агрегатор]

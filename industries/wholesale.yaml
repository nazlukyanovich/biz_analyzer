id: wholesale
title: Оптовая торговля и дистрибуция
group: Торговля
status: short
markers: [оптов, оптом, дистриб, дилер, торговые точк, торговых точ, сетевые магазин, поставляем в магазин]

sales_model:
  clients: B2B — магазины, сети, HoReCa, другие оптовики
  deal_type: регулярные поставки по прайсу, часто с отсрочкой
  cycle: первая сделка 1–4 недели, дальше заказы каждую неделю или месяц
  avg_check: 30 тыс. – 2 млн ₽
  repeat: очень высоко — вся выручка на повторных заказах

lead_sources: [торговые представители, холодные звонки, выставки, рекомендации, сайт и прайс по запросу, маркетплейсы B2B]

funnel:
  - новый контакт
  - квалификация (формат точки, объёмы)
  - прайс и условия отправлены
  - пробный заказ
  - договор и условия отсрочки
  - регулярные заказы
  - клиент «уснул» — реактивация

sales_pains:
  - заказы принимаются в мессенджерах и по телефону, потом вручную переносятся в 1С
  - никто не замечает, что клиент перестал заказывать, пока не пропал совсем
  - торговые представители работают без маршрутов и отчётов
  - дебиторка и лимиты отсрочки контролируются вручную
  - новых клиентов почти не ищут, всё держится на старой базе

questions:
  q_sales_flow:
    - text: Как постоянные клиенты делают заказы — звонят, пишут в мессенджер, через сайт? Кто переносит заказ в учётную систему?
      skip_if: [переносит, вносит в 1с, личный кабинет]
  q_sales_control:
    - text: Как вы замечаете, что клиент стал заказывать меньше или пропал?
      skip_if: [замеча, отчёт по клиент, отчет по клиент]
  q_metrics:
    - text: Как контролируете отсрочку и долги — есть лимиты на клиента?
      skip_if: [лимит, дебитор]

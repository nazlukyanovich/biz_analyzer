id: agency
title: Маркетинговое и digital-агентство, веб-студия
group: Услуги для бизнеса
status: full
markers: [маркетингов агентств, рекламн агентств, digital, диджитал, smm, смм, таргет, контекстн реклам, seo, сео, продвижени, веб-студи, разработк сайт, создание сайт, сайты под ключ, лендинг, брендинг, performance, перформанс, медиабаинг, видеопродакшн, продакшн]

sales_model:
  clients: B2B — малый и средний бизнес, эксперты и инфобизнес
  deal_type: проект (сайт, брендинг) или ежемесячное сопровождение (SMM, реклама, SEO)
  cycle: 1–6 недель
  avg_check: 50 тыс. – 1 млн ₽, сопровождение — 30–300 тыс. ₽ в месяц
  repeat: ключевое — удержание клиентов на абонементе и допродажа услуг

lead_sources: [сарафан, кейсы и портфолио, личный бренд основателя, тендеры и площадки (Workspace, Profi), холодные письма и звонки, партнёры (другие агентства, IT-интеграторы), собственная реклама]

funnel:
  - новая заявка
  - квалификация (бюджет, задача, кто решает)
  - бриф или созвон
  - аудит или стратегия (иногда платно)
  - КП, смета или медиаплан
  - презентация и торг
  - договор и предоплата
  - запуск работ и онбординг клиента
  - ежемесячные отчёты
  - продление, расширение или допродажа

sales_roles: [основатель (часто единственный продавец), аккаунт-менеджер, менеджер по продажам, проджект-менеджер, специалисты (таргетологи, SMM, дизайнеры, разработчики)]
documents: [бриф, КП или медиаплан, смета, договор, техническое задание, ежемесячный отчёт, акт, счёт]
terms: [бриф, КП, медиаплан, абонентка или ретейнер, аккаунтинг, ROMI, CPL, KPI, отток клиентов, допродажа, upsell]

sales_pains:
  - продаёт только основатель — без него новых клиентов нет
  - нет системного потока заявок, всё держится на сарафане
  - КП и медиапланы каждый раз делаются с нуля, уходят дни
  - бесплатные аудиты и стратегии отнимают время и не конвертируются в договоры
  - клиенты уходят через 2–3 месяца, причину никто не выясняет
  - нет контроля, кому пора продлевать договор и предложить новую услугу
  - аккаунт-менеджеры не допродают — клиент берёт одну услугу годами
  - цены «на глаз», нет понимания маржинальности проектов и загрузки команды

other_pains:
  - отчёты клиентам собираются вручную и отнимают дни
  - согласования правок в бесконечных чатах
  - проекты выходят за бюджет часов, команда перегружена

automation:
  - воронка продаж в CRM с этапами от заявки до договора и задачами на каждое касание
  - шаблоны КП, смет и медиапланов из карточки сделки
  - воронка клиентов на сопровождении — продление, риск оттока, допродажа
  - автоматические отчёты клиентам из рекламных кабинетов
  - учёт часов и маржинальности по проектам
  - регулярный опрос удовлетворённости (NPS) и сигнал аккаунту, если клиент недоволен

questions:
  q_lead_sources:
    - text: Откуда приходят новые клиенты — сарафан, кейсы, ваша реклама, холодные письма? Есть стабильный поток или «как повезёт»?
      skip_if: [стабильн, поток]
  q_owner_role:
    - text: Кто у вас продаёт — вы лично или есть менеджер? Что будет с продажами, если вы уйдёте в отпуск на месяц?
      skip_if: [продаю сам, продаёт менеджер, продает менеджер]
  q_sales_flow:
    - text: Сколько времени уходит на подготовку одного КП или медиаплана? Есть шаблоны?
      skip_if: [шаблон]
    - text: Делаете бесплатные аудиты или стратегии? Сколько из них превращаются в договор?
      skip_if: [аудит]
    - text: Что происходит, если клиент получил КП и замолчал?
      skip_if: [дожим, перезван]
  q_decisions:
    - text: Как считаете цену проекта или абонентки? Знаете маржу по каждому клиенту?
      skip_if: [марж]
  q_after_sale:
    - text: Сколько месяцев в среднем клиент остаётся с вами? Почему уходят?
      skip_if: [месяц, уходят]
    - text: Предлагаете действующим клиентам другие услуги? Кто за это отвечает?
      skip_if: [допрода, upsell]
  q_routine:
    - text: Как готовите отчёты клиентам — вручную или автоматически? Сколько времени это занимает?
      skip_if: [отчёт, отчет]

avoid:
  - проверять клиента на знание маркетинговых терминов — он и так в теме, говорим о его продажах

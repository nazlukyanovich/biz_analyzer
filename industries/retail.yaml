id: retail
title: Розничный магазин (офлайн)
group: Торговля
status: full
markers: [магазин, розничн, розниц, бутик, торговый зал, торговом центр, точка продаж, точки продаж, шоурум, павильон, сеть магазин]

sales_model:
  clients: частники
  deal_type: с полки, плюс заказ под клиента
  cycle: в день визита, заказ под клиента — до 2 недель
  avg_check: 500 ₽ – 50 тыс. ₽ (мебель, техника — выше)
  repeat: высоко при программе лояльности, иначе неуправляемо

lead_sources: [проходящий трафик, карты и отзывы, соцсети магазина, сарафан, акции и листовки, онлайн-витрина или сайт]

funnel:
  - посетитель
  - консультация продавца
  - подбор и примерка или демонстрация
  - покупка
  - карта лояльности или контакт
  - заказ под клиента (если нет в наличии)
  - повторный визит

sales_roles: [продавец-консультант, старший продавец или администратор, управляющий, собственник]
documents: [чек, карта лояльности, бланк заказа под клиента, гарантийный талон, возврат и обмен]
terms: [трафик, конверсия в покупку, средний чек, UPT (товаров в чеке), допродажа, план продаж, мотивация продавцов]

sales_pains:
  - продажи только «кто зашёл», контакты покупателей не собираются
  - нет понимания, сколько людей зашло и сколько купило — конверсия неизвестна
  - не видно, кто из продавцов продаёт лучше и почему
  - продавцы не допродают — средний чек стоит на месте
  - заказы под клиента записываются в тетрадь и теряются, клиенту не перезванивают
  - бонусная программа есть, но не используется для возврата клиентов
  - соцсети и сообщения от покупателей ведутся от случая к случаю

other_pains:
  - остатки неизвестны продавцу, «посмотрю на складе» уходит в никуда
  - графики продавцов и подмены — в чате, без учёта
  - нет плана продаж на смену или продавца

automation:
  - касса и CRM связаны — каждая покупка привязана к клиенту
  - программа лояльности с автоматическими сообщениями — бонусы сгорают, новая коллекция, день рождения
  - заказ под клиента в CRM с задачей перезвонить, когда товар пришёл
  - счётчик посетителей и отчёт по конверсии
  - план продаж и рейтинг продавцов в реальном времени
  - онлайн-витрина с бронью товара для самовывоза

questions:
  q_lead_volume:
    - text: Знаете, сколько людей в день заходит в магазин и сколько из них покупают?
      skip_if: [счётчик, счетчик, конверси]
  q_sales_flow:
    - text: Что делаете, если нужного товара нет в наличии? Как запоминаете такой заказ и перезваниваете клиенту?
      skip_if: [под заказ, предзаказ]
    - text: Продавцы предлагают что-то к покупке — сопутствующие товары, уход, аксессуары? Это как-то контролируется?
      skip_if: [допрода, сопутств]
  q_sales_control:
    - text: Видите продажи по каждому продавцу? Есть план на смену или месяц?
      skip_if: [по продав, план продаж]
  q_departments:
    - text: Как мотивируете продавцов — оклад, процент с продаж, бонусы за план?
      skip_if: [процент, мотиваци]
  q_after_sale:
    - text: Собираете контакты покупателей? Используете их, чтобы позвать снова?
      skip_if: [карт лояльн, бонус]
  q_communication:
    - text: Пишут ли покупатели в соцсети и мессенджеры магазина? Кто отвечает и как быстро?
      skip_if: [отвечает]
  q_double_entry:
    - text: Продавец видит остатки на складе и в других магазинах, когда говорит с покупателем?
      skip_if: [остат]

avoid:
  - вопросы про логистику поставщиков, если клиент сам не начал

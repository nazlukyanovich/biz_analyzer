id: real_estate
title: Недвижимость (агентства, застройщики, аренда)
group: Услуги для людей
status: short
markers: [недвижим, риелтор, риэлтор, агентство недвижим, новостройк, застройщик, жилой комплекс, ипотек, аренд квартир, посуточн]

sales_model:
  clients: частники и инвесторы
  deal_type: сделка купли-продажи или аренды, комиссия
  cycle: 2 недели – 6 месяцев
  avg_check: комиссия 50 тыс. – 1 млн ₽, квартира у застройщика — миллионы
  repeat: низко, зато сильны рекомендации

lead_sources: [Циан и Авито, сайт и контекст, сарафан, соцсети агентов, партнёры (банки, застройщики)]

funnel:
  - заявка
  - квалификация (бюджет, ипотека, сроки)
  - подбор объектов
  - показы
  - бронь или задаток
  - ипотека и проверка документов
  - сделка
  - рекомендации

sales_pains:
  - заявки с площадок разбирают агенты в своих телефонах, база уходит вместе с ними
  - длинные сделки, клиент забывается между показами
  - нет контроля, сколько показов делает агент и сколько закрывает
  - звонки не записываются, качество работы агентов неизвестно

questions:
  q_sales_flow:
    - text: Заявки с Циана и Авито попадают в общую базу или в телефоны агентов?
      skip_if: [общ баз, crm]
  q_sales_control:
    - text: Видите, сколько показов и сделок у каждого агента?
      skip_if: [по агент]

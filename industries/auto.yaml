id: auto
title: Автобизнес — автосервис и СТО, запчасти, детейлинг, автомойки, продажа автомобилей
group: Торговля
status: full
markers: [автосервис, сто$, станция техобслуживан, автосалон, автомобил, автозапчаст, запчаст, шиномонтаж, детейлинг, полировк, керамик, бронеплен, химчистк салон, автомойк, мойк самообслуживан, мойк авто, кузовн, покраск авто, тюнинг, автоэлектрик, развал-схожден, техобслуживан, автозвук, автостекл, тонировк, автодилер, подбор авто, автоподбор]

sales_model:
  clients: частники и автопарки компаний (такси, доставка, корпоративный транспорт)
  deal_type: запись на услугу, подбор запчасти, пакеты и абонементы (мойка), продажа автомобиля
  cycle: в день обращения (мойка, шиномонтаж) – неделя (кузовной ремонт, детейлинг) – месяц (продажа авто)
  avg_check: 500 ₽ (мойка) – 150 тыс. ₽ (ремонт, детейлинг), автомобиль — миллионы
  repeat: высоко — ТО, сезонная смена шин, мойки, ремонт; автопарки — постоянно

lead_sources: [Яндекс Карты и 2ГИС, отзывы, сайт и агрегаторы, Авито и Дром, соцсети с работами «до и после», сарафан, корпоративные договоры, страховые]

funnel:
  - звонок, заявка или сообщение
  - подбор запчасти по VIN или запись на время
  - подтверждение записи
  - приёмка автомобиля и диагностика
  - согласование работ и цены (доп. работы)
  - работы
  - выдача и оплата
  - отзыв
  - напоминание о следующем визите (ТО, шины, мойка, обновление керамики)

sales_roles: [мастер-приёмщик или администратор, менеджер по запчастям, мастера, менеджер по корпоративным клиентам, собственник]
documents: [заказ-наряд, акт приёмки авто, акт выполненных работ, счёт, гарантия, договор с автопарком, абонемент]
terms: [заказ-наряд, приёмка, диагностика, нормо-час, VIN, ТО, доп. работы, пакет услуг, абонемент на мойку, загрузка постов или боксов]

sales_pains:
  - запись в тетради или таблице, посты и боксы простаивают, а в пиковые дни очередь
  - звонки пропускаются в загруженные часы — клиент уезжает к соседям
  - доп. работы после диагностики согласуются по телефону и не фиксируются — потом споры о цене
  - подбор запчасти по VIN занимает много времени, клиенту не перезванивают с ценой
  - нет напоминаний о ТО, сезонной смене шин, обновлении керамики — клиенты не возвращаются
  - на мойке нет базы клиентов, абонементы и пакеты не продаются
  - мастер-приёмщик не допродаёт — не предлагает сопутствующие работы
  - корпоративные клиенты (автопарки) без отдельных условий и отчётов
  - отзывы на картах не собираются и не обрабатываются

other_pains:
  - сделки и деньги «мимо кассы» у мастеров
  - запчасти заказываются у поставщиков вручную, сроки срываются
  - нет учёта загрузки мастеров, зарплата считается вручную по нормо-часам

automation:
  - онлайн-запись с видимостью свободных постов, боксов и мастеров
  - напоминание о записи и подтверждение ботом — меньше неявок
  - заказ-наряд в CRM, согласование доп. работ сообщением с фото и подтверждением клиента
  - история обслуживания по каждому автомобилю
  - автонапоминания — ТО по пробегу или сроку, смена шин весной и осенью, обновление керамики
  - абонементы и пакеты на мойку с учётом остатка
  - просьба об отзыве на картах после выдачи автомобиля
  - отдельная воронка для автопарков с отчётами по их машинам

questions:
  q_lead_sources:
    - text: Откуда приходит больше клиентов — карты, Авито, соцсети, сарафан? Работаете с автопарками или страховыми?
      skip_if: [автопарк, страхов]
  q_communication:
    - text: Сколько звонков пропускаете в загруженные часы? Перезваниваете на пропущенные?
      skip_if: [пропущен]
  q_sales_flow:
    - text: Как клиенты записываются и как вы видите свободные посты, боксы или мастеров?
      skip_if: [онлайн-запис, yclients, календар]
    - text: Подтверждаете запись накануне? Много ли неявок?
      skip_if: [подтвержд, неявк]
    - text: Если клиент спрашивает запчасть — сколько времени уходит на подбор и цену? Перезваниваете, если он не дождался?
      skip_if: [vin, подбор]
  q_decisions:
    - text: Если при диагностике нашли ещё поломки — как согласуете доп. работы и цену с клиентом? Фиксируете это где-то?
      skip_if: [согласу]
  q_fulfillment_flow:
    - text: Ведёте историю обслуживания каждой машины — что делали, когда, какие запчасти ставили?
      skip_if: [истори]
  q_after_sale:
    - text: Напоминаете клиентам о следующем ТО, смене шин или обновлении покрытия?
      skip_if: [напомина]
    - text: Продаёте абонементы или пакеты услуг — на мойку, детейлинг, ТО?
      skip_if: [абонемент, пакет]
    - text: Просите клиентов оставить отзыв на картах после визита?
      skip_if: [отзыв]

avoid:
  - технические вопросы про ремонт конкретных узлов — нас интересуют продажи и запись

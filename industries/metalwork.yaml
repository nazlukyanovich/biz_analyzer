id: metalwork
title: Металлообработка и металлоконструкции на заказ
group: Продажи под заказ, B2B
status: full
markers: [металл, сварк, сварщик, резк, гибк, лазерн, плазм, чпу, токарн, фрезер, ворот, навес, лестниц, ограждени, ковк, кованы, порошков]

sales_model:
  clients: B2B (подрядчики, застройщики, заводы) и частники
  deal_type: под заказ
  cycle: 3 дня – 2 месяца
  avg_check: 50 тыс. – 5 млн ₽
  repeat: средне — подрядчики и застройщики возвращаются, частники редко

lead_sources: [сайт и заявки с карт, сарафан, тендеры, Авито, подрядчики и прорабы, холодные звонки по стройкам]

funnel:
  - новая заявка
  - уточнение задачи, замер или чертёж
  - расчёт стоимости
  - КП отправлено
  - согласование и торг
  - договор и предоплата
  - в производстве
  - отгрузка или монтаж
  - окончательный расчёт

sales_roles: [менеджер (часто собственник), сметчик или инженер, замерщик]
documents: [КП, расчёт или смета, договор, счёт, спецификация, чертёж, акт, УПД]
terms: [чертёж, эскиз, замер, раскрой, гибка, сварка, порошковая покраска, металлопрокат, ОТК]

sales_pains:
  - расчёт стоимости занимает дни, считает только собственник или инженер
  - заявки теряются в мессенджерах и звонках, нет единой базы
  - КП отправили и забыли, никто не дожимает
  - нет понимания, сколько сделок в работе и на каком этапе
  - менеджер обещает сроки, не зная загрузки цеха
  - тендеры и крупные заказы ведутся «в голове», без плана касаний
  - старых клиентов никто не обзванивает, повторных продаж мало

other_pains:
  - переделки из-за ошибок замера или чертежа
  - металл закупается под каждый заказ, цены скачут, маржа «плавает»
  - очередь на один станок или одного сварщика, срывы сроков

automation:
  - единая воронка в CRM, заявки с сайта, телефонии и мессенджеров падают туда сами
  - калькулятор или шаблон расчёта, чтобы менеджер считал без собственника
  - КП и договор по шаблону из карточки сделки
  - задача «дожать КП» через 2 дня автоматически
  - статус «в производстве» виден менеджеру, клиенту уходит уведомление
  - напоминания старым клиентам раз в квартал

questions:
  q_sales_flow:
    - text: Клиент прислал чертёж или просит замер. Кто считает стоимость и сколько времени это занимает?
      skip_if: [считает, расчёт, расчет, смет]
    - text: Что происходит с КП после отправки? Кто и когда перезванивает клиенту?
      skip_if: [перезван, дожим, напомина]
  q_decisions:
    - text: Может ли менеджер сам назвать цену и срок, или всё идёт через вас?
      skip_if: [сам назнач, сам считает]
  q_fulfillment_flow:
    - text: Как менеджер узнаёт, что цех загружен и новый заказ не успеют к сроку?
      skip_if: [загрузк, график производ, план производ]
  q_after_sale:
    - text: Возвращаются ли к вам подрядчики и застройщики? Кто поддерживает с ними связь между заказами?
  q_losses:
    - text: Бывали переделки из-за ошибок в замере или чертеже? Кто за них платит?
      skip_if: [передел]

avoid:
  - абстрактные слова вроде «маркетинговая стратегия» и «позиционирование»

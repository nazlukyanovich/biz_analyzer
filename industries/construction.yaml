id: construction
title: Строительство и ремонт (подряд, отделка, инженерные системы)
group: Продажи под заказ, B2B
status: full
markers: [строител, стройк, ремонт квартир, ремонт под ключ, отделк, подряд, бригад, прораб, смет, фундамент, кровл, электромонтаж, сантехническ, отоплени, коттедж, каркасн]

sales_model:
  clients: частники (ремонт, дома) и B2B (коммерческие объекты, генподрядчики)
  deal_type: проект
  cycle: 2 недели – 3 месяца
  avg_check: 300 тыс. – десятки млн ₽
  repeat: низко у частников, высоко у B2B-заказчиков и генподрядчиков

lead_sources: [сайт и контекст, Авито, Профи.ру и площадки, сарафан, дизайнеры и архитекторы, тендеры, застройщики]

funnel:
  - новая заявка
  - выезд на объект и осмотр
  - смета
  - смета отправлена
  - согласование сметы и торг
  - договор и аванс
  - работы по этапам
  - сдача этапов и оплаты
  - сдача объекта и гарантия

sales_roles: [менеджер или собственник, сметчик, прораб, снабженец]
documents: [смета, КП, договор подряда, график работ, акты по этапам (КС-2 и КС-3 для B2B), допсоглашения]
terms: [смета, объект, этап, прораб, черновые и чистовые работы, допработы, аванс, КС-2]

sales_pains:
  - смету считает только собственник или один сметчик, клиент ждёт неделю
  - смету отправили, дальше тишина, нет системы дожима
  - нет учёта, на какой стадии каждый объект и сколько денег должны клиенты
  - допработы согласуются устно, потом споры об оплате
  - тендеры ищут вручную, документы собирают каждый раз с нуля
  - клиентов после сдачи не просят о рекомендациях и отзывах

other_pains:
  - смета расходится с фактом, перерасход материалов
  - прораб — единственный, кто знает, что происходит на объекте
  - кассовые разрывы из-за задержки оплат по этапам

automation:
  - воронка «заявка → смета → договор» в CRM и отдельная воронка этапов объекта
  - шаблоны смет и расценки, чтобы сметчик или менеджер считал быстрее
  - задача дожать смету через 2–3 дня
  - фотоотчёты прораба в карточке объекта, клиенту — короткий отчёт
  - контроль оплат по этапам с напоминаниями
  - запрос отзыва и рекомендации после сдачи объекта

questions:
  q_sales_flow:
    - text: Кто считает смету и сколько дней клиент её ждёт?
      skip_if: [дней, день, неделю, сутки]
    - text: Что происходит, если клиент получил смету и пропал?
      skip_if: [перезван, дожим, напомина]
  q_sales_control:
    - text: Как вы видите, на каком этапе каждый объект и сколько денег вам должны заказчики?
      skip_if: [дебитор, должны]
  q_decisions:
    - text: Как согласуются допработы — письменно или устно? Бывают споры об оплате?
      skip_if: [допсоглаш, письменно]
  q_single_person:
    - text: Что будет с объектами, если прораб заболеет на две недели?
      skip_if: [прораб]

avoid:
  - вопросы, понятные только сметчикам (ГЭСН, ФЕР), если клиент сам их не назвал

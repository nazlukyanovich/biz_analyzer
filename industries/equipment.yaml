id: equipment
title: Оборудование и спецтехника (продажа, аренда, сервис)
group: Продажи под заказ, B2B
status: full
markers: [оборудовани, спецтехник, станк, станок, погрузчик, экскаватор, генератор, компрессор, аренда техник, аренду техник, промышленн, сервисн обслуживани, запчаст к оборуд, холодильное оборуд, торговое оборуд]

sales_model:
  clients: B2B (заводы, стройки, магазины, общепит)
  deal_type: продажа, аренда или сервисный договор
  cycle: 2 недели – 6 месяцев, аренда — 1–3 дня
  avg_check: 100 тыс. – десятки млн ₽
  repeat: высоко — сервис, расходники, аренда снова и снова

lead_sources: [сайт и контекст, выставки, тендеры, дилерская сеть, холодные звонки, рекомендации, Авито для аренды]

funnel:
  - новая заявка
  - квалификация — кто решает, бюджет, сроки
  - подбор оборудования и техническая консультация
  - КП отправлено
  - демонстрация, тест или выезд инженера
  - согласование с закупками или тендер
  - договор и оплата или лизинг
  - поставка и пусконаладка
  - сервис, расходники, допродажи

sales_roles: [менеджер по продажам, технический специалист или инженер, тендерный специалист, сервисный инженер, диспетчер аренды]
documents: [КП, техническое задание, спецификация, договор поставки или аренды, акт ввода в эксплуатацию, сервисный договор]
terms: [КП, ТЗ, пусконаладка, лизинг, сервисный договор, ЗИП, тендер, закупочная комиссия]

sales_pains:
  - длинные сделки, менеджер забывает про клиента между касаниями
  - не знают, кто у клиента принимает решение, переговоры идут не с тем человеком
  - КП собирается вручную из каталога и прайсов поставщиков, долго
  - тендеры отслеживаются вручную, сроки подачи срываются
  - сервисные клиенты не превращаются в продажи нового оборудования
  - аренда — график техники в таблице, двойные брони и простой

other_pains:
  - сервисные заявки теряются, нет контроля сроков выезда инженера
  - нет истории обслуживания по каждой единице оборудования

automation:
  - воронка с этапами длинной сделки и задачами на каждое касание
  - карточка компании с лицом, принимающим решение, и всеми контактами
  - генерация КП из каталога и прайса в CRM
  - отдельная воронка тендеров с напоминаниями о сроках
  - календарь аренды техники с бронированием
  - сервисная воронка, история обслуживания и напоминания о ТО

questions:
  q_sales_flow:
    - text: Сколько обычно длится сделка от первого звонка до оплаты? Как менеджер не забывает про клиента за это время?
      skip_if: [месяц, недел, задач]
    - text: Как вы выясняете, кто у клиента принимает решение о покупке?
      skip_if: [лпр, принимает решени, директор решает]
  q_lead_sources:
    - text: Участвуете в тендерах? Кто их ищет и следит за сроками?
      skip_if: [тендер]
  q_after_sale:
    - text: Продаёте клиентам сервис и расходники после покупки? Кто напоминает о плановом ТО?
      skip_if: [сервисн, техобслуж]
  q_fulfillment_flow:
    - text: Если сдаёте технику в аренду — как ведёте график, чтобы не было двойных броней и простоя?
      skip_if: [не сдаём, без аренды]

avoid:
  - слишком технические вопросы про само оборудование — нас интересуют продажи

id: it_crm
title: IT-разработка, внедрение CRM и автоматизация
group: Услуги для бизнеса
status: short
markers: [битрикс, bitrix, амоцрм, amocrm, crm, срм, интегратор, внедрени, автоматизац, разработк по, разработк програм, saas, айти, 1с]

sales_model:
  clients: B2B
  deal_type: лицензии, проект внедрения, разработка, техподдержка
  cycle: 2 недели – 3 месяца
  avg_check: 50 тыс. – несколько млн ₽
  repeat: высоко — продление лицензий, доработки, поддержка

lead_sources: [партнёрство с вендором, сайт и контекст, сарафан, вебинары, холодные звонки, тендеры]

funnel:
  - новая заявка
  - квалификация и встреча
  - обследование и ТЗ
  - КП и оценка проекта
  - согласование и договор
  - предоплата
  - внедрение по этапам
  - сдача, обучение, поддержка
  - продление лицензии и доработки

sales_pains:
  - собственник сам и продаёт, и считает проект, и согласует всё
  - обследование бесплатное и долгое, многие клиенты на нём и заканчиваются
  - оценка проекта «на глаз», проекты уходят в минус по часам
  - продления лицензий отслеживаются вручную, клиенты уходят к другому партнёру
  - нет допродаж поддержки после внедрения

questions:
  q_sales_flow:
    - text: Обследование или аудит у вас платный? Сколько клиентов после него подписывают договор?
      skip_if: [платн, бесплатн]
  q_decisions:
    - text: Кто оценивает стоимость и сроки проекта? Часто ли проекты выходят за оценку?
      skip_if: [оценива]
  q_after_sale:
    - text: Как отслеживаете окончание лицензий и предлагаете поддержку после внедрения?
      skip_if: [продлени, лицензи]

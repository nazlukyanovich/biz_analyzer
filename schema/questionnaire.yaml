# Анкета v1 — интервью для разбора бизнеса
# Формат: блоки → базовые вопросы → правила углубления (followups).
# fills — какие поля business_model.schema.json заполняет ответ.
# Цель: 15–20 минут на базовый проход, дальше ИИ углубляется только туда, где пусто или болит.
#
# Поля для бота-интервьюера (bot/clarifier.py):
#   clarify   — уточнения, если ответ размытый или слишком короткий (задаются по порядку, не больше двух).
#   min_words — сколько слов считать достаточным ответом (по умолчанию 5).
#   expect    — что должно быть в ответе: number — хотя бы одна цифра.
#   followups — углубление по процессу; skip_if — слова, при которых пункт уже раскрыт и не задаётся.

version: "1.0"
language: ru

# Экспресс-режим бота: только эти вопросы, одно уточнение, без углубления — около 5 минут.
# Для бесплатной воронки; полный разбор — все вопросы.
express:
  - q_company
  - q_products
  - q_size
  - q_lead_sources
  - q_lead_volume
  - q_departments
  - q_sales_flow
  - q_tools
  - q_losses
  - q_magic_wand

interview_rules:
  - Задавать по одному вопросу, коротко, без канцелярита.
  - Если ответ размытый («ну, менеджер всё делает») — один уточняющий вопрос, не больше двух подряд.
  - Не выдумывать: всё, что не сказано прямо, помечать source=inferred и выносить в open_questions.
  - После каждого блока коротко пересказать понятое и попросить поправить.
  - Можно отвечать голосом или прислать транскрипт созвона вместо ответов.

blocks:

  - id: intro
    title: Знакомство
    questions:
      - id: q_company
        text: Как называется компания и чем занимаетесь — в двух словах, как объяснили бы другу?
        fills: [company.name, company.description, company.industry]
        clarify:
          - А что конкретно вы делаете для клиента? Например, «собираем и доставляем букеты по городу за 2 часа».
      - id: q_products
        text: Что продаёте? Перечислите основные товары или услуги и примерный средний чек.
        fills: [products]
        expect: number
        clarify:
          - Какой примерно средний чек? Можно вилкой, например «от 3 до 10 тысяч».
          - Что из этого приносит больше всего денег?
      - id: q_clients
        text: Кто ваши клиенты — компании или частные лица? Опишите типичного клиента.
        fills: [company.business_model, customer_segments]
        clarify:
          - Опишите одного конкретного клиента из последних — кто он и зачем к вам пришёл?
      - id: q_size
        text: Сколько человек в команде, включая вас? Если готовы — примерный оборот в месяц.
        fills: [company.employees, company.revenue_range]
        min_words: 1
        expect: number
        clarify:
          - Назовите хотя бы примерное число людей в команде, включая подрядчиков на постоянке.
      - id: q_goals
        text: Чего хотите добиться в ближайший год? Что для вас будет результатом?
        fills: [company.goals]
        clarify:
          - Как поймёте, что цель достигнута? Какая цифра должна измениться — выручка, число клиентов, ваше время?

  - id: leads
    title: Откуда приходят клиенты
    questions:
      - id: q_lead_sources
        text: Откуда приходят клиенты? Сайт, реклама, соцсети, сарафан, маркетплейсы, холодные звонки — что из этого и какой канал главный?
        fills: [channels]
        min_words: 2
        clarify:
          - Какой из этих каналов приводит больше всего клиентов? Примерно в процентах.
      - id: q_lead_volume
        text: Сколько обращений примерно в месяц? И сколько из них становятся покупателями?
        fills: [channels.leads_per_month, metrics]
        min_words: 2
        expect: number
        clarify:
          - Хотя бы примерно — 10, 50, 200 заявок в месяц? И из десяти обратившихся сколько покупают?
      - id: q_communication
        text: Где общаетесь с клиентами — телефон, WhatsApp, Telegram, почта, Instagram?
        fills: [channels, systems]
        min_words: 1
        clarify:
          - Где идёт основная переписка, а что используется изредка?

  - id: structure
    title: Команда и роли
    questions:
      - id: q_departments
        text: Какие есть отделы или направления? Кто чем занимается?
        fills: [departments, roles]
        clarify:
          - Перечислите людей или должности и по одной фразе — за что каждый отвечает.
          - Кто кому подчиняется?
      - id: q_owner_role
        text: Какие задачи сейчас делаете лично вы? Что без вас не происходит?
        fills: [roles.is_owner, issues.owner_dependency]
        clarify:
          - Что вы делали руками за последнюю неделю? Перечислите 3–5 дел.
      - id: q_decisions
        text: Кто принимает решения по скидкам, срокам, нестандартным заказам?
        fills: [roles.responsibilities]
        min_words: 2
        clarify:
          - Что происходит, если этого человека нет на месте — решение ждёт или кто-то его заменяет?

  - id: sales
    title: Путь клиента от заявки до оплаты
    questions:
      - id: q_sales_flow
        text: Опишите по шагам, что происходит, когда приходит новая заявка — и до момента оплаты. Кто что делает?
        fills: [processes]
        min_words: 15
        clarify:
          - Давайте по шагам на примере последней заявки — 1, 2, 3… Кто делал каждый шаг?
          - Что было между первым сообщением клиента и оплатой? Счёт, согласование, предоплата?
        followups:
          - text: Кто первым видит заявку и через сколько отвечает?
            skip_if: [минут, час, сразу, моментально]
          - text: Где это фиксируется — CRM, таблица, блокнот, просто в мессенджере?
            skip_if: [crm, срм, црм, таблиц, excel, эксель, битрикс, amo, амо, блокнот, 1с]
          - text: Что происходит, если клиент не ответил или сказал «подумаю»?
            skip_if: [подумаю, не ответил, перезван, напомина, дожим]
          - text: Где чаще всего клиенты отваливаются?
            skip_if: [отваливаю, теряем, сливаю, уходят]
      - id: q_sales_control
        text: Как вы понимаете, сколько заявок в работе и на каком они этапе?
        fills: [metrics, issues.no_tracking]
        clarify:
          - Если прямо сейчас спросить — сколько заявок в работе, где вы это посмотрите?

  - id: fulfillment
    title: Выполнение заказа
    questions:
      - id: q_fulfillment_flow
        text: Что происходит после оплаты? Как заказ передаётся в производство, доставку или исполнителю?
        fills: [processes]
        min_words: 12
        clarify:
          - Давайте по шагам на примере последнего заказа — кто что сделал после оплаты?
        followups:
          - text: Как исполнитель узнаёт о заказе и его деталях?
            skip_if: [чат, пишет, пересыла, задач, карточк, бланк]
          - text: Бывает, что что-то теряется или путается при передаче? Пример?
            skip_if: [теря, путаю, путаница, ошиб]
          - text: Как клиент узнаёт о статусе заказа?
            skip_if: [статус, уведом, сообщаем клиенту]
      - id: q_after_sale
        text: Что происходит после того, как клиент получил заказ? Есть повторные продажи, отзывы, напоминания?
        fills: [processes, issues.no_follow_up]
        min_words: 2
        clarify:
          - Возвращаются ли клиенты сами? Вы как-то с ними связываетесь после покупки?

  - id: systems
    title: Инструменты
    questions:
      - id: q_tools
        text: Какими программами и сервисами пользуетесь? CRM, Excel/Google-таблицы, 1С, мессенджеры, телефония, таск-трекер.
        fills: [systems]
        min_words: 2
        clarify:
          - Для чего каждая из этих программ — где заказы, где деньги, где задачи?
      - id: q_double_entry
        text: Есть данные, которые вносятся вручную в несколько мест? Например, заказ сначала в мессенджер, потом в таблицу, потом в 1С.
        fills: [issues.duplicate_data, steps.is_manual]
        min_words: 1
        clarify:
          - Какие именно данные и куда переносятся? Кто этим занимается?

  - id: numbers
    title: Цифры и контроль
    questions:
      - id: q_metrics
        text: Какие показатели вы регулярно смотрите? Выручка, количество заявок, конверсия, средний чек — что из этого считаете и как часто?
        fills: [metrics]
        min_words: 3
        clarify:
          - Где вы эти цифры берёте — отчёт в CRM, таблица, считаете вручную? Как часто смотрите?

  - id: pains
    title: Где болит
    questions:
      - id: q_losses
        text: Где, по-вашему, вы теряете клиентов, деньги или время?
        fills: [issues]
        clarify:
          - Вспомните последний случай, когда клиент ушёл или заказ сорвался. Что произошло?
      - id: q_single_person
        text: Есть процессы, которые держатся на одном человеке? Что будет, если он уйдёт в отпуск?
        fills: [issues.single_point_of_failure]
        min_words: 1
        clarify:
          - Кто это и что именно встанет без него?
      - id: q_routine
        text: Какая рутина бесит больше всего вас или команду?
        fills: [issues.manual_work]
        clarify:
          - Сколько времени в неделю на это уходит, хотя бы примерно?
      - id: q_magic_wand
        text: Если бы можно было по щелчку исправить одну вещь в бизнесе — что это было бы?
        fills: [issues, company.goals]
        min_words: 3
        clarify:
          - А что изменится в деньгах или во времени, если это исправить?

# Правило углубления для каждого процесса, найденного в ответах
process_deep_dive:
  ask_until_filled: [trigger, steps, steps.role_id, steps.system_ids, result]
  questions:
    - С чего начинается этот процесс?
    - Перечислите шаги по порядку. Кто делает каждый шаг?
    - Где на каком шаге приходится ждать? Сколько?
    - В какой программе это делается?
    - Чем процесс заканчивается и как понять, что он прошёл успешно?
  max_followups_per_process: 5
